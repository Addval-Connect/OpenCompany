# Release workflow: predeploy gate, publish the registry tarball to npmjs and
# GitHub Packages with bun. No npm CLI and no setup-node: bun packs, authenticates
# (~/.npmrc written from the job's token) and publishes.
# Triggers on version tag push.

name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  predeploy:
    uses: ./.github/workflows/predeploy.yml

  publish-npm:
    name: Publish to npm
    needs: predeploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: python -m cli version sync
      - name: Configure npmjs credentials
        run: printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify npmjs credentials
        run: bun pm whoami
      - name: Publish public package
        run: bun publish --access public

  publish-github-packages:
    name: Publish to GitHub Packages
    needs: predeploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: python -m cli version sync
      - name: Configure scoped package
        run: |
          bun -e "
            const pkg = require('./package.json');
            pkg.name = '@zeenie-ai/opencompany';
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
      # GitHub Packages uses the repository-scoped GITHUB_TOKEN.
      - name: Configure GitHub Packages credentials
        run: printf '//npm.pkg.github.com/:_authToken=%s\n' "$NPM_TOKEN" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun publish

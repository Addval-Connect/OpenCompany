; OpenCompany single-port runtime, as one supervisor program with its logs
; under /var/log/opencompany/.
;
; This is the same process ``company serve`` launches -- uvicorn serving the
; REST API + WebSocket + the built SPA on one port -- invoked through the
; server venv's interpreter directly so the unit has no runtime dependency on
; ``uv`` (or on the root node_modules that the CLI's build check requires).
;
; ``__OC_PORT__`` is substituted by bootstrap.sh from PYTHON_BACKEND_PORT in
; the deployed .env; there is no port literal in this file.
;
; ``__OC_APP_USER__`` and ``__OC_APP_HOME__`` are substituted from bootstrap.sh's
; APP_USER and that account's home as passwd reports it. Neither is spelled out
; here on purpose: with the name written twice as a literal, renaming the service
; account in bootstrap.sh would leave this file pointing at an account that no
; longer exists, and supervisor reports that as a startup failure per program
; rather than as a configuration error.
;
; ``__OC_AWS_ENV__`` is substituted by bootstrap.sh with either
; ``,AWS_REGION="<region>"`` or nothing at all. Bedrock needs a region however
; it authenticates -- its endpoint is regional and an API key carries no region
; -- and it has to live here rather than in .env because
; BedrockProvider.resolve_region reads os.environ directly, while this program
; runs uvicorn rather than ``company serve``, so nothing exports .env into the
; process environment. An AWS_REGION in .env reaches pydantic-settings and the
; SDK not at all. The empty case is a real one and is why this is a whole
; fragment instead of just the value: a configured-but-blank AWS_REGION is not
; the same as an absent one, so the assignment is omitted rather than emptied.
[program:opencompany]
command=/opt/opencompany/server/.venv/bin/python -m uvicorn main:app --host 127.0.0.1 --port __OC_PORT__ --log-level warning
directory=/opt/opencompany/server
user=__OC_APP_USER__
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
; uvicorn traps SIGINT for a graceful shutdown; the process group stop keeps
; the on-demand Node sidecar from being orphaned.
stopsignal=INT
stopasgroup=true
killasgroup=true
environment=PYTHONUNBUFFERED="1",PYTHONUTF8="1",SERVE_STATIC_CLIENT="1",PORT="__OC_PORT__",HOME="__OC_APP_HOME__",PATH="/usr/local/bin:/usr/bin:/bin"__OC_AWS_ENV__
stdout_logfile=/var/log/opencompany/app.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/var/log/opencompany/error.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5

# OpenCompany vhost -- the only app on this instance.
#
# ``default_server`` is claimed on purpose: this is a dedicated host, so a
# request arriving with an unknown Host header (the bare public IP, a stale DNS
# name) should reach OpenCompany rather than nginx's "Welcome" page. bootstrap.sh
# removes Ubuntu's packaged ``default`` site when it installs this one, because
# two vhosts both marked default_server is an nginx *error*, not a warning, and
# ``nginx -t`` would fail the deploy.
#
# ``server_name`` still lists the domain so certbot can find and rewrite this
# vhost, and so ``$host``-derived redirects use the name rather than the IP.
#
# Port 80 only. ``certbot --nginx -d <domain>`` rewrites this file in place to
# add the 443 listener and the http->https redirect.
#
# ``__OC_DOMAIN__`` / ``__OC_PORT__`` are substituted by bootstrap.sh from
# --domain and PYTHON_BACKEND_PORT in the deployed .env.

upstream opencompany_app {
    server 127.0.0.1:__OC_PORT__;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name __OC_DOMAIN__;

    # Workspace file uploads and media nodes move real files.
    client_max_body_size 100M;

    access_log /var/log/nginx/opencompany.access.log;
    error_log  /var/log/nginx/opencompany.error.log;

    # /ws/status is a long-lived WebSocket: the Upgrade hop and a read timeout
    # longer than the client's own heartbeat are both required, or nginx closes
    # the socket mid-run and the canvas silently stops receiving node status.
    location /ws/ {
        proxy_pass http://opencompany_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://opencompany_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An agent run streams for minutes before the HTTP response completes;
        # the nginx default of 60s would surface as a 504 mid-execution.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # Buffering off keeps token-by-token responses flowing to the browser.
        proxy_buffering off;
    }
}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2340"/>
      <stop offset="1" stop-color="#0e1020"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bd93f9"/>
      <stop offset="1" stop-color="#8be9fd"/>
    </linearGradient>
  </defs>
  <!-- rounded app tile -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- workflow edges -->
  <g stroke="#6272a4" stroke-width="22" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M300 420 C 380 420, 400 512, 480 512"/>
    <path d="M300 604 C 380 604, 400 512, 480 512"/>
    <path d="M544 512 C 620 512, 640 420, 724 420"/>
    <path d="M544 512 C 620 512, 640 604, 724 604"/>
  </g>
  <!-- nodes -->
  <circle cx="300" cy="420" r="58" fill="#50fa7b"/>
  <circle cx="300" cy="604" r="58" fill="#ffb86c"/>
  <circle cx="724" cy="420" r="58" fill="#ff79c6"/>
  <circle cx="724" cy="604" r="58" fill="#f1fa8c"/>
  <!-- central agent ring: the "O" -->
  <circle cx="512" cy="512" r="118" fill="none" stroke="url(#ring)" stroke-width="44"/>
  <circle cx="512" cy="512" r="40" fill="#f8f8f2"/>
</svg>
